services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_vm_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  postgres:
    image: postgres:16
    container_name: kafka_vm_postgres
    environment:
      POSTGRES_DB: machine_monitoring
      POSTGRES_USER: monitoring_user
      POSTGRES_PASSWORD: monitoring_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_control_room_model.sql:/docker-entrypoint-initdb.d/02_control_room_model.sql:ro

  consumer:
    build: .
    container_name: kafka_vm_consumer
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: machine_events
      KAFKA_CONSUMER_GROUP: postgres-writer
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: machine_monitoring
      POSTGRES_USER: monitoring_user
      POSTGRES_PASSWORD: monitoring_password
    command: ["python", "-u", "consumer/postgres_event_consumer.py"]
    restart: unless-stopped

  producer:
    build: .
    container_name: kafka_vm_producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: machine_events
      PRODUCER_EVENT_INTERVAL_SECONDS: 60
      PRODUCER_EVENTS_PER_BATCH: 10
      PRODUCER_MAX_BATCHES: ""
    command: ["python", "-u", "producer/machine_event_producer.py"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: kafka_vm_grafana
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kafka_control_room.json
      GF_SMTP_ENABLED: "${GRAFANA_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM_ADDRESS:-grafana-alerts@example.invalid}"
      GF_SMTP_FROM_NAME: "${GRAFANA_SMTP_FROM_NAME:-Kafka Monitoring Grafana}"
      GF_SMTP_STARTTLS_POLICY: "${GRAFANA_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}"
      GRAFANA_ALERT_EMAIL_TO: "${GRAFANA_ALERT_EMAIL_TO:-grafana-alerts@example.invalid}"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  grafana_data:

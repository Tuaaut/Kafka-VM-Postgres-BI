apiVersion: 1

groups:
  - orgId: 1
    name: kafka_control_room
    folder: Kafka Monitoring
    interval: 30s
    rules:
      - uid: kafka_plant_state_critical
        title: Plant State Critical
        condition: C
        data:
          - refId: A
            datasourceUid: machine_monitoring_postgres
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: postgres
                uid: machine_monitoring_postgres
              editorMode: code
              format: table
              rawQuery: true
              rawSql: |
                WITH metrics AS (
                  SELECT
                    COUNT(*) AS total_events,
                    COUNT(*) FILTER (WHERE status = 'failed') AS failed_events,
                    COUNT(*) FILTER (WHERE status = 'warning') AS warning_events,
                    ROUND(COUNT(*) FILTER (WHERE status = 'failed')::NUMERIC / NULLIF(COUNT(*), 0) * 100, 2) AS failure_rate_pct,
                    ROUND(AVG(temperature), 2) AS avg_temperature,
                    ROUND(EXTRACT(EPOCH FROM (MAX(ingest_time) - MAX(event_time)))::NUMERIC, 2) AS latest_lag_seconds
                  FROM machine_events_raw
                  WHERE event_time >= NOW() - INTERVAL '15 minutes'
                )
                SELECT
                  CASE
                    WHEN total_events = 0 THEN 0
                    WHEN failure_rate_pct >= 10
                      OR warning_events >= 10
                      OR avg_temperature >= 85
                      OR latest_lag_seconds >= 300 THEN 1
                    ELSE 0
                  END AS value
                FROM metrics;
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: kafka-machine-monitoring
        panelId: 1
        noDataState: OK
        execErrState: Error
        for: 60s
        annotations:
          summary: Plant state is critical.
          description: The 15-minute control-room window crossed a critical threshold.
        labels:
          project: kafka_vm_postgres_bi
          severity: critical

      - uid: kafka_ingest_lag_high
        title: Ingest Lag Above 300s
        condition: C
        data:
          - refId: A
            datasourceUid: machine_monitoring_postgres
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: postgres
                uid: machine_monitoring_postgres
              editorMode: code
              format: table
              rawQuery: true
              rawSql: |
                SELECT
                  COALESCE(
                    ROUND(EXTRACT(EPOCH FROM (MAX(ingest_time) - MAX(event_time)))::NUMERIC, 2),
                    0
                  ) AS value
                FROM machine_events_raw
                WHERE event_time >= NOW() - INTERVAL '15 minutes';
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: kafka-machine-monitoring
        panelId: 4
        noDataState: OK
        execErrState: Error
        for: 60s
        annotations:
          summary: Kafka/PostgreSQL ingest lag is high.
          description: Latest ingest lag is above 300 seconds.
        labels:
          project: kafka_vm_postgres_bi
          severity: warning
